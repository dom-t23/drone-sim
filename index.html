<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Drone Sim</title>
  <meta name="description" content="A self-flying racing drone in the browser, developed overnight by Claude.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Crect x='8' y='8' width='16' height='16' fill='none' stroke='%23ff8a3d' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0b1220; --panel: rgba(11, 18, 32, .72); --line: rgba(255,255,255,.12);
      --ink: #e8edf5; --muted: #8fa0b8; --accent: #ff8a3d; --ok: #3ddc97;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    canvas { display: block; }
    .hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .title { font-weight: 700; letter-spacing: .02em; }
    .title small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 2px; }
    .stats { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-variant-numeric: tabular-nums;
      flex-shrink: 0; white-space: nowrap; }
    .stats span:nth-child(odd) { color: var(--muted); font-size: 12px; align-self: center; }
    .stats b { font-weight: 600; text-align: right; }
    .controls { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
      border-radius: 999px; padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    button:hover { border-color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .fpv-label { position: fixed; right: 18px; color: var(--muted); font-size: 11px; letter-spacing: .1em;
      text-transform: uppercase; pointer-events: none; }
    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; font-weight: 700;
      color: var(--ok); opacity: 0; transition: opacity .4s; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
    .toast.show { opacity: 1; }
    .toast.bad { color: #ff5c5c; }
    .overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .col { display: flex; flex-direction: column; gap: 8px; max-width: 300px; min-width: 0; }
    .note { font-size: 12px; line-height: 1.4; color: var(--muted); transition: opacity 1.2s; }
    .note b { color: #4dd2ff; font-weight: 600; }
    .note.fade { opacity: 0; }
    [hidden] { display: none !important; }
    button.on { border-color: var(--accent); color: var(--accent); }
    .tm { width: 260px; font-size: 12px; padding: 8px 12px 10px; }
    .tm-legend { color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .tm-legend .sw { display: inline-block; width: 14px; height: 2px; margin-left: 6px; }
    .tm-legend .sw:first-child { margin-left: 0; }
    .tm-legend .sw.dash { height: 0; border-top: 2px dashed; }
    .tm-head { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); }
    .tm-head i { font-style: normal; font-size: 10px; opacity: .7; margin-left: 4px; }
    .tm-head b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
    .tm-chart { display: block; width: 100%; height: 40px; }
    .tm-splits div { display: grid; grid-template-columns: 1fr auto 52px; gap: 8px; font-variant-numeric: tabular-nums; }
    .tm-splits span { color: var(--muted); }
    .tm-splits b { font-weight: 600; }
    .tm-splits em { font-style: normal; text-align: right; color: var(--muted); }
    .tm-splits .tm-empty { display: block; color: var(--muted); }
    .err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
    .countdown { position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); font-size: 84px; font-weight: 800;
      color: var(--ink); pointer-events: none; text-shadow: 0 4px 24px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }
    .countdown.go { color: var(--ok); }
    .stats b.ahead { color: var(--ok); }
    .stats b.behind { color: #ff7a7a; }
    .pads { position: fixed; left: 16px; right: 16px; bottom: 150px; display: flex; justify-content: space-between; pointer-events: none; }
    .pad { position: relative; width: 124px; height: 124px; border-radius: 50%; background: rgba(11, 18, 32, .45);
      border: 1px solid var(--line); pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
    .pad .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
      background: rgba(255, 138, 61, .55); border: 1px solid var(--accent); }
    .pad span { position: absolute; left: 0; right: 0; bottom: -18px; text-align: center; font-size: 10px; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted); }
    @media (max-width: 560px) { .countdown { font-size: 64px; } .pad { width: 110px; height: 110px; } }
    @media (max-width: 560px) { .title small { display: none; } .stats { font-size: 13px; } .note { font-size: 11px; } .tm { width: 200px; } .tm-chart { height: 30px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas class="overlay" id="overlay"></canvas>
  <div class="hud">
    <div class="col">
      <div class="panel title">Drone Sim<small>Self-flying racer · built overnight by Claude</small></div>
      <div class="panel note" id="nav-note" hidden></div>
      <div class="panel tm" id="telemetry" hidden aria-label="Telemetry"></div>
    </div>
    <div class="panel stats" aria-live="polite">
      <span>Lap</span><b id="s-lap">–</b>
      <span>Last</span><b id="s-last">–</b>
      <span>Best</span><b id="s-best">–</b>
      <span>Speed</span><b id="s-speed">–</b>
      <span>Gates</span><b id="s-gates">0</b>
      <span>Plan</span><b id="s-plan">–</b>
      <span>Course</span><b id="s-course">–</b>
      <span id="r-vis" hidden>Vision</span><b id="s-vis" hidden>–</b>
      <span id="r-wind" hidden>Wind</span><b id="s-wind" hidden>–</b>
      <span id="r-rival" hidden>Rival</span><b id="s-rival" hidden>–</b>
      <span id="r-ghost" hidden>Ghost</span><b id="s-ghost" hidden>–</b>
    </div>
  </div>
  <div class="fpv-label" id="fpv-label">Onboard camera</div>
  <div class="toast" id="toast"></div>
  <div class="countdown" id="countdown" hidden></div>
  <div class="pads" id="pads" hidden>
    <div class="pad" id="pad-l" aria-label="Speed and turn stick"><div class="knob"></div><span>speed · turn</span></div>
    <div class="pad" id="pad-r" aria-label="Climb and drift stick"><div class="knob"></div><span>climb · drift</span></div>
  </div>
  <div class="controls">
    <button id="b-cam">Camera: chase</button>
    <button id="b-speed">Speed: 1×</button>
    <button id="b-pilot">Pilot: racing line</button>
    <button id="b-diff">Course: normal</button>
    <button id="b-nav">Nav: ground truth</button>
    <button id="b-wind">Wind: off</button>
    <button id="b-tm">Telemetry</button>
    <button id="b-ghost" class="on" title="Gold ghost of the best lap (G)">Ghost</button>
    <button id="b-course">New course</button>
    <button id="b-share">Share</button>
  </div>
  <div class="err" id="err">This demo needs WebGL. Try a recent version of Chrome, Firefox or Safari.</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
